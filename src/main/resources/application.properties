spring.application.name=shopify-store
server.port=8080

# ---------- MySQL (default). Change username/password to match your MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/shopify_store?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT (secret must be at least 32 characters) ----------
app.jwt.secret=${JWT_SECRET:change-this-secret-key-to-a-long-random-string-123456}
app.jwt.expiration-ms=86400000

# ---------- Default admin created on first start ----------
app.admin.name=Store Admin
app.admin.email=admin@shopify.com
app.admin.password=Admin@123
