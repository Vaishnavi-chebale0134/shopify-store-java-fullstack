<!doctype html>
<html lang="en">
<head>
  <title>Admin - Shopify store</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container" style="max-width:1100px">
    <h2 class="my-4">Admin dashboard</h2>

    <div class="row mb-4" id="stats"></div>

    <ul class="nav nav-tabs mb-3" id="adminTabs">
      <li class="nav-item"><a class="nav-link active" href="#" data-tab="products">Products</a></li>
      <li class="nav-item"><a class="nav-link" href="#" data-tab="orders">Orders</a></li>
      <li class="nav-item"><a class="nav-link" href="#" data-tab="messages">Messages</a></li>
    </ul>

    <div id="tab-products">
      <button class="btn btn-dark mb-3" id="addProductBtn">+ Add product</button>
      <div class="table-responsive"><table class="table table-sm"><thead><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead><tbody id="productRows"></tbody></table></div>
    </div>
    <div id="tab-orders" class="d-none"><div class="table-responsive"><table class="table table-sm"><thead><tr><th>#</th><th>Customer</th><th>Items</th><th>Total</th><th>Date</th><th>Status</th></tr></thead><tbody id="orderRows"></tbody></table></div></div>
    <div id="tab-messages" class="d-none"><div id="messageList"></div></div>
  </div>

  <!-- add / edit product modal -->
  <div class="modal fade" id="productModal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document"><div class="modal-content">
      <form id="productForm">
        <div class="modal-header"><h5 class="modal-title" id="modalTitle">Add product</h5><button type="button" class="close" data-dismiss="modal"><span>&times;</span></button></div>
        <div class="modal-body">
          <input type="hidden" id="pId">
          <div class="form-group"><label>Name</label><input class="form-control" id="pName" required></div>
          <div class="form-row">
            <div class="form-group col-6"><label>Price (Rs)</label><input type="number" min="0" step="0.01" class="form-control" id="pPrice" required></div>
            <div class="form-group col-6"><label>Stock</label><input type="number" min="0" class="form-control" id="pStock" required></div>
          </div>
          <div class="form-group"><label>Category</label><input class="form-control" id="pCategory" list="catList" required><datalist id="catList"></datalist></div>
          <div class="form-group"><label>Image path</label><input class="form-control" id="pImage" placeholder="/images/products/product-01.jpg.webp"></div>
          <div class="form-group"><label>Description</label><textarea class="form-control" id="pDesc" rows="2"></textarea></div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button><button type="submit" class="btn btn-dark">Save</button></div>
      </form>
    </div></div>
  </div>

  <div id="footer"></div>
  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    renderNavbar('admin', false);
    renderFooter();

    if (!Auth.isAdmin) {
      window.location.href = 'login.html?next=admin.html';
    }

    var products = [];

    /* ----- tabs ----- */
    document.querySelectorAll('#adminTabs a').forEach(function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        document.querySelectorAll('#adminTabs a').forEach(function (x) { x.classList.toggle('active', x === a); });
        ['products', 'orders', 'messages'].forEach(function (t) {
          document.getElementById('tab-' + t).classList.toggle('d-none', t !== a.dataset.tab);
        });
        if (a.dataset.tab === 'orders') loadOrders();
        if (a.dataset.tab === 'messages') loadMessages();
      });
    });

    /* ----- dashboard stats ----- */
    async function loadStats() {
      var s = await api('/api/admin/stats');
      var cards = [
        ['Products', s.products, 'bg-primary'], ['Orders', s.orders, 'bg-success'],
        ['Customers', s.customers, 'bg-info'], ['Revenue', money(s.revenue), 'bg-dark']
      ];
      document.getElementById('stats').innerHTML = cards.map(function (c) {
        return '<div class="col-6 col-md-3 mb-3"><div class="stat-card ' + c[2] + '"><div>' + c[0] + '</div><h3 class="mb-0">' + c[1] + '</h3></div></div>';
      }).join('');
    }

    /* ----- products ----- */
    async function loadProducts() {
      products = await api('/api/products');
      document.getElementById('productRows').innerHTML = products.map(function (p) {
        return '<tr><td><img class="thumb" src="' + esc(p.imageUrl) + '" alt=""></td><td>' + esc(p.name) + '</td><td>' + esc(p.category) + '</td>' +
          '<td>' + money(p.price) + '</td><td>' + p.stock + '</td>' +
          '<td class="text-nowrap"><button class="btn btn-sm btn-outline-secondary" data-edit="' + p.id + '">Edit</button> ' +
          '<button class="btn btn-sm btn-outline-danger" data-del="' + p.id + '">Delete</button></td></tr>';
      }).join('');

      document.querySelectorAll('[data-edit]').forEach(function (b) {
        b.addEventListener('click', function () { openModal(products.find(function (p) { return p.id === Number(b.dataset.edit); })); });
      });
      document.querySelectorAll('[data-del]').forEach(function (b) {
        b.addEventListener('click', async function () {
          if (!confirm('Delete this product?')) return;
          try {
            await api('/api/products/' + b.dataset.del, { method: 'DELETE' });
            toast('Product deleted');
            loadProducts(); loadStats();
          } catch (err) { toast(err.message, 'danger'); }
        });
      });

      var cats = await api('/api/categories');
      document.getElementById('catList').innerHTML = cats.map(function (c) { return '<option value="' + esc(c) + '">'; }).join('');
    }

    function openModal(p) {
      document.getElementById('modalTitle').textContent = p ? 'Edit product' : 'Add product';
      document.getElementById('pId').value = p ? p.id : '';
      document.getElementById('pName').value = p ? p.name : '';
      document.getElementById('pPrice').value = p ? p.price : '';
      document.getElementById('pStock').value = p ? p.stock : '';
      document.getElementById('pCategory').value = p ? p.category : '';
      document.getElementById('pImage').value = p ? (p.imageUrl || '') : '';
      document.getElementById('pDesc').value = p ? (p.description || '') : '';
      $('#productModal').modal('show');
    }
    document.getElementById('addProductBtn').addEventListener('click', function () { openModal(null); });

    document.getElementById('productForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var id = document.getElementById('pId').value;
      var body = {
        name: document.getElementById('pName').value,
        price: Number(document.getElementById('pPrice').value),
        stock: Number(document.getElementById('pStock').value),
        category: document.getElementById('pCategory').value,
        imageUrl: document.getElementById('pImage').value,
        description: document.getElementById('pDesc').value
      };
      try {
        await api(id ? '/api/products/' + id : '/api/products', { method: id ? 'PUT' : 'POST', body: body });
        $('#productModal').modal('hide');
        toast('Product saved');
        loadProducts(); loadStats();
      } catch (err) { toast(err.message, 'danger'); }
    });

    /* ----- orders ----- */
    async function loadOrders() {
      var orders = await api('/api/admin/orders');
      var statuses = ['PLACED', 'SHIPPED', 'DELIVERED', 'CANCELLED'];
      document.getElementById('orderRows').innerHTML = orders.map(function (o) {
        var opts = statuses.map(function (s) { return '<option' + (s === o.status ? ' selected' : '') + '>' + s + '</option>'; }).join('');
        var items = o.items.map(function (i) { return esc(i.productName) + ' x' + i.quantity; }).join('<br>');
        return '<tr><td>' + o.id + '</td><td>' + esc(o.customerName) + '<br><small class="text-muted">' + esc(o.customerEmail) + '</small></td>' +
          '<td><small>' + items + '</small></td><td>' + money(o.totalAmount) + '</td><td><small>' + formatDate(o.createdAt) + '</small></td>' +
          '<td><select class="form-control form-control-sm" data-order="' + o.id + '">' + opts + '</select></td></tr>';
      }).join('') || '<tr><td colspan="6" class="text-muted">No orders yet.</td></tr>';

      document.querySelectorAll('select[data-order]').forEach(function (sel) {
        sel.addEventListener('change', async function () {
          try {
            await api('/api/admin/orders/' + sel.dataset.order + '/status', { method: 'PATCH', body: { status: sel.value } });
            toast('Order #' + sel.dataset.order + ' marked ' + sel.value);
            loadStats();
          } catch (err) { toast(err.message, 'danger'); }
        });
      });
    }

    /* ----- contact messages ----- */
    async function loadMessages() {
      var msgs = await api('/api/admin/messages');
      document.getElementById('messageList').innerHTML = msgs.map(function (m) {
        return '<div class="card mb-3"><div class="card-body"><div class="d-flex justify-content-between"><strong>' + esc(m.name || 'Anonymous') +
          ' &lt;' + esc(m.email) + '&gt;</strong><small class="text-muted">' + formatDate(m.createdAt) + '</small></div><p class="mb-0 mt-2">' + esc(m.message) + '</p></div></div>';
      }).join('') || '<p class="text-muted">No messages yet.</p>';
    }

    if (Auth.isAdmin) {
      loadStats().catch(function (e) { toast(e.message, 'danger'); });
      loadProducts().catch(function (e) { toast(e.message, 'danger'); });
    }
  </script>
</body>
</html>
