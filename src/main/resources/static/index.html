<!doctype html>
<html lang="en">
<head>
  <title>Shopify store</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <div id="navbar"></div>

  <!-- hero carousel -->
  <div id="heroCarousel" class="carousel slide carousel-fade hero" data-ride="carousel" data-interval="4000">
    <div class="carousel-inner">
      <div class="carousel-item active"><img src="images/banners/banner1.jpg" class="d-block w-100" alt="Banner 1"></div>
      <div class="carousel-item"><img src="images/banners/banner2.jpg" class="d-block w-100" alt="Banner 2"></div>
      <div class="carousel-item"><img src="images/banners/banner3.jpg" class="d-block w-100" alt="Banner 3"></div>
      <div class="carousel-item"><img src="images/banners/banner4.avif" class="d-block w-100" alt="Banner 4"></div>
    </div>
    <a class="carousel-control-prev" href="#heroCarousel" role="button" data-slide="prev"><span class="carousel-control-prev-icon" aria-hidden="true"></span><span class="sr-only">Previous</span></a>
    <a class="carousel-control-next" href="#heroCarousel" role="button" data-slide="next"><span class="carousel-control-next-icon" aria-hidden="true"></span><span class="sr-only">Next</span></a>
  </div>

  <!-- category cards -->
  <div class="container mt-5">
    <div class="row">
      <div class="col-md-4 mb-3"><div class="cat-card" data-cat="Women"><img src="images/cat-women.webp" alt="Women"><span class="cat-title">Women</span></div></div>
      <div class="col-md-4 mb-3"><div class="cat-card" data-cat="Men"><img src="images/cat-men.avif" alt="Men"><span class="cat-title">Men</span></div></div>
      <div class="col-md-4 mb-3"><div class="cat-card" data-cat="Accessories"><img src="images/cat-glasses.jpg" alt="Accessories"><span class="cat-title">Accessories</span></div></div>
    </div>
  </div>

  <!-- products (loaded from the Spring Boot REST API) -->
  <div class="container" id="products">
    <h1 class="headingpr mt-5">PRODUCT OVERVIEW</h1>
    <div class="filter-bar" id="filterBar"></div>
    <div class="row" id="productGrid"></div>
    <p class="text-center text-muted my-5 d-none" id="emptyMsg">No products found.</p>
  </div>

  <!-- sale banner -->
  <div class="container mt-5">
    <div class="sale">
      <img src="images/sale.jpg" alt="Sale">
      <div class="sale-text">
        <h3>-60%</h3>
        <h1 id="timestamp"></h1>
        <h2>Global Sale</h2>
        <a href="#products" class="btn btn-dark">Buy Now</a>
      </div>
    </div>
  </div>

  <!-- brands -->
  <div class="container mt-5">
    <div class="row brandnames text-center">
      <div class="col-4 col-sm-2 mb-3"><img src="images/brand1.webp" class="img-fluid" alt="Brand 1"></div>
      <div class="col-4 col-sm-2 mb-3"><img src="images/brand2.webp" class="img-fluid" alt="Brand 2"></div>
      <div class="col-4 col-sm-2 mb-3"><img src="images/brand3.webp" class="img-fluid" alt="Brand 3"></div>
      <div class="col-4 col-sm-2 mb-3"><img src="images/brand4.webp" class="img-fluid" alt="Brand 4"></div>
      <div class="col-4 col-sm-2 mb-3"><img src="images/brand5.webp" class="img-fluid" alt="Brand 5"></div>
      <div class="col-4 col-sm-2 mb-3"><img src="images/brand6.webp" class="img-fluid" alt="Brand 6"></div>
    </div>
  </div>

  <div id="footer"></div>
  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    renderNavbar('home', true);
    renderFooter();

    var state = { category: 'All', q: '' };

    // live clock in the sale banner (from the original s1.js)
    function pad(n) { return String(n).padStart(2, '0'); }
    setInterval(function () {
      var d = new Date();
      document.getElementById('timestamp').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    }, 1000);

    async function loadCategories() {
      var cats = await api('/api/categories');
      var bar = document.getElementById('filterBar');
      bar.innerHTML = ['All'].concat(cats).map(function (c) {
        return '<button data-cat="' + esc(c) + '" class="' + (c === state.category ? 'active' : '') + '">' + esc(c) + '</button>';
      }).join('');
      bar.querySelectorAll('button').forEach(function (b) {
        b.addEventListener('click', function () { setCategory(b.dataset.cat); });
      });
    }

    function setCategory(cat) {
      state.category = cat;
      document.querySelectorAll('#filterBar button').forEach(function (b) {
        b.classList.toggle('active', b.dataset.cat === cat);
      });
      loadProducts();
    }

    async function loadProducts() {
      var params = new URLSearchParams();
      if (state.category !== 'All') params.set('category', state.category);
      if (state.q) params.set('q', state.q);
      var grid = document.getElementById('productGrid');
      try {
        var products = await api('/api/products?' + params.toString());
        document.getElementById('emptyMsg').classList.toggle('d-none', products.length > 0);
        grid.innerHTML = products.map(function (p) {
          var out = p.stock <= 0;
          return '<div class="col-6 col-md-3 mb-4"><div class="product-card">' +
            '<img src="' + esc(p.imageUrl) + '" alt="' + esc(p.name) + '">' +
            '<div class="card-body">' +
            '<div class="pcat">' + esc(p.category) + '</div>' +
            '<h5 class="pname">' + esc(p.name) + '</h5>' +
            '<div class="pprice">' + money(p.price) + '</div>' +
            (out ? '<div class="stock-low mb-2">Out of stock</div>'
                 : (p.stock <= 5 ? '<div class="stock-low mb-2">Only ' + p.stock + ' left</div>' : '')) +
            '<button class="btn btn-sm btn-dark btn-block add-btn" data-id="' + p.id + '"' + (out ? ' disabled' : '') + '>Add to cart</button>' +
            '</div></div></div>';
        }).join('');

        grid.querySelectorAll('.add-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var p = products.find(function (x) { return x.id === Number(btn.dataset.id); });
            Cart.add(p, 1);
            toast(p.name + ' added to cart');
          });
        });
      } catch (err) {
        grid.innerHTML = '<div class="col-12"><div class="alert alert-danger">Could not load products: ' + esc(err.message) + '</div></div>';
      }
    }

    document.getElementById('searchForm').addEventListener('submit', function (e) {
      e.preventDefault();
      state.q = document.getElementById('searchInput').value.trim();
      loadProducts();
      document.getElementById('products').scrollIntoView({ behavior: 'smooth' });
    });

    document.querySelectorAll('.cat-card').forEach(function (card) {
      card.addEventListener('click', function () {
        setCategory(card.dataset.cat);
        document.getElementById('products').scrollIntoView({ behavior: 'smooth' });
      });
    });

    loadCategories().then(loadProducts);
  </script>
</body>
</html>
