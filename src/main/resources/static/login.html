<!doctype html>
<html lang="en">
<head>
  <title>Login - Shopify store</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container page-box" style="max-width:460px">
    <ul class="nav nav-tabs mb-4" id="authTabs">
      <li class="nav-item"><a class="nav-link active" href="#" data-tab="login">Login</a></li>
      <li class="nav-item"><a class="nav-link" href="#" data-tab="register">Register</a></li>
    </ul>

    <form id="loginForm">
      <div class="form-group"><label>Email</label><input type="email" class="form-control" id="loginEmail" required></div>
      <div class="form-group"><label>Password</label><input type="password" class="form-control" id="loginPassword" required></div>
      <button class="btn btn-dark btn-block" type="submit">Login</button>
    </form>

    <form id="registerForm" class="d-none">
      <div class="form-group"><label>Full name</label><input type="text" class="form-control" id="regName" required></div>
      <div class="form-group"><label>Email</label><input type="email" class="form-control" id="regEmail" required></div>
      <div class="form-group"><label>Password (min 6 characters)</label><input type="password" class="form-control" id="regPassword" minlength="6" required></div>
      <button class="btn btn-dark btn-block" type="submit">Create account</button>
    </form>
  </div>
  <div id="footer"></div>
  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    renderNavbar('login', false);
    renderFooter();

    var next = new URLSearchParams(window.location.search).get('next') || 'index.html';

    document.querySelectorAll('#authTabs a').forEach(function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        document.querySelectorAll('#authTabs a').forEach(function (x) { x.classList.toggle('active', x === a); });
        document.getElementById('loginForm').classList.toggle('d-none', a.dataset.tab !== 'login');
        document.getElementById('registerForm').classList.toggle('d-none', a.dataset.tab !== 'register');
      });
    });

    async function submitAuth(url, body) {
      try {
        var data = await api(url, { method: 'POST', body: body });
        Auth.save(data);
        window.location.href = data.role === 'ADMIN' && next === 'index.html' ? 'admin.html' : next;
      } catch (err) {
        toast(err.message, 'danger');
      }
    }

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      submitAuth('/api/auth/login', {
        email: document.getElementById('loginEmail').value,
        password: document.getElementById('loginPassword').value
      });
    });

    document.getElementById('registerForm').addEventListener('submit', function (e) {
      e.preventDefault();
      submitAuth('/api/auth/register', {
        name: document.getElementById('regName').value,
        email: document.getElementById('regEmail').value,
        password: document.getElementById('regPassword').value
      });
    });
  </script>
</body>
</html>
