<!doctype html>
<html lang="en">
<head>
  <title>Your cart - Shopify store</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container page-box">
    <h2 class="mb-4">Your cart</h2>
    <div id="cartArea"></div>
  </div>
  <div id="footer"></div>
  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    renderNavbar('cart', false);
    renderFooter();

    function renderCart() {
      var items = Cart.items();
      var area = document.getElementById('cartArea');

      if (items.length === 0) {
        area.innerHTML = '<div class="alert alert-info">Your cart is empty. <a href="index.html#products">Continue shopping</a></div>';
        return;
      }

      var rows = items.map(function (i) {
        return '<tr>' +
          '<td><img class="cart-img" src="' + esc(i.imageUrl) + '" alt=""></td>' +
          '<td>' + esc(i.name) + '<br><small class="text-muted">' + money(i.price) + '</small></td>' +
          '<td style="white-space:nowrap">' +
          '<button class="btn btn-outline-secondary btn-sm qty-btn" data-act="dec" data-id="' + i.id + '">-</button> ' +
          '<span class="mx-2">' + i.qty + '</span> ' +
          '<button class="btn btn-outline-secondary btn-sm qty-btn" data-act="inc" data-id="' + i.id + '">+</button></td>' +
          '<td>' + money(i.price * i.qty) + '</td>' +
          '<td><button class="btn btn-sm btn-outline-danger" data-act="rm" data-id="' + i.id + '">Remove</button></td></tr>';
      }).join('');

      area.innerHTML =
        '<div class="table-responsive"><table class="table"><thead><tr><th></th><th>Product</th><th>Qty</th><th>Subtotal</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<h4 class="text-right">Total: ' + money(Cart.total()) + '</h4>' +
        '<div class="form-group mt-4"><label for="address"><strong>Shipping address</strong></label>' +
        '<textarea id="address" class="form-control" rows="3" placeholder="House no, street, city, PIN code"></textarea></div>' +
        '<button class="btn btn-dark btn-lg" id="placeOrder">Place order</button>';

      area.querySelectorAll('button[data-act]').forEach(function (b) {
        b.addEventListener('click', function () {
          var id = Number(b.dataset.id);
          var item = Cart.items().find(function (x) { return x.id === id; });
          if (b.dataset.act === 'inc') Cart.setQty(id, item.qty + 1);
          if (b.dataset.act === 'dec') Cart.setQty(id, item.qty - 1);
          if (b.dataset.act === 'rm') Cart.remove(id);
          renderCart();
        });
      });
      document.getElementById('placeOrder').addEventListener('click', placeOrder);
    }

    async function placeOrder() {
      if (!Auth.isLoggedIn) {
        window.location.href = 'login.html?next=cart.html';
        return;
      }
      var address = document.getElementById('address').value.trim();
      if (!address) { toast('Please enter your shipping address', 'warning'); return; }

      var btn = document.getElementById('placeOrder');
      btn.disabled = true;
      try {
        var order = await api('/api/orders', {
          method: 'POST',
          body: {
            shippingAddress: address,
            items: Cart.items().map(function (i) { return { productId: i.id, quantity: i.qty }; })
          }
        });
        Cart.clear();
        document.getElementById('cartArea').innerHTML =
          '<div class="alert alert-success"><h4 class="alert-heading">Order placed!</h4>' +
          '<p>Your order <strong>#' + order.id + '</strong> for ' + money(order.totalAmount) + ' has been placed.</p>' +
          '<a href="orders.html" class="btn btn-dark">View my orders</a></div>';
      } catch (err) {
        toast(err.message, 'danger');
        btn.disabled = false;
      }
    }

    renderCart();
  </script>
</body>
</html>
