<!doctype html>
<html lang="en">
<head>
  <title>Contact us - Shopify store</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container page-box" style="max-width:600px">
    <h2 class="mb-4">Contact us</h2>
    <form id="contactForm">
      <div class="form-group"><label for="cName">Your name</label><input type="text" class="form-control" id="cName" placeholder="Your name"></div>
      <div class="form-group"><label for="cEmail">Email address</label><input type="email" class="form-control" id="cEmail" placeholder="name@example.com" required></div>
      <div class="form-group"><label for="cMessage">Message</label><textarea class="form-control" id="cMessage" rows="4" required></textarea></div>
      <button class="btn btn-dark" type="submit">Send message</button>
    </form>
  </div>
  <div id="footer"></div>
  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    renderNavbar('contact', false);
    renderFooter();

    document.getElementById('contactForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      try {
        var res = await api('/api/contact', {
          method: 'POST',
          body: {
            name: document.getElementById('cName').value,
            email: document.getElementById('cEmail').value,
            message: document.getElementById('cMessage').value
          }
        });
        toast(res.message);
        e.target.reset();
      } catch (err) {
        toast(err.message, 'danger');
      }
    });
  </script>
</body>
</html>
